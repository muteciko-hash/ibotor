<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<link rel="apple-touch-icon" id="ic">
<style>
:root{--ac:#f5a524;--mut:#9aa0ab;--pw:clamp(104px,29vw,150px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff;font:15px/1.4 Nunito,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;padding:calc(env(safe-area-inset-top) + 4px) 8px 4px 16px;background:linear-gradient(#000 65%,rgba(0,0,0,0))}
#top b{color:var(--ac);font-size:18px;margin-right:10px}
.tab{height:44px;padding:0 10px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent}
.tab.on{color:#fff;border-color:var(--ac)}
.ib{width:44px;height:44px;border-radius:22px;display:grid;place-items:center}
#hero{position:relative;margin-top:-64px;min-height:clamp(320px,50vh,470px);display:flex;align-items:flex-end;background:#111 center top/cover}
#hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#000 3%,rgba(0,0,0,.45) 55%,rgba(0,0,0,.2))}
#hc{position:relative;z-index:1;width:100%;padding:0 16px 14px;display:flex;flex-direction:column;gap:8px}
h1{margin:0;font-size:clamp(24px,7vw,34px);line-height:1.1;text-shadow:0 2px 12px #000}
h3{margin:4px 0 12px;font-size:18px;padding-right:52px}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#d5d8de;font-size:13px}
.pill{font-weight:700;color:#000;background:#f5c518;border-radius:5px;padding:2px 7px}
.pill.t{background:#01b4e4}
.ov{margin:0;color:#e1e3e8;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ov.open{-webkit-line-clamp:unset}
.bt{display:flex;gap:8px}
.b{flex:1;height:46px;border-radius:12px;font-weight:700;background:rgba(255,255,255,.14)}
.b.p1{background:var(--ac);color:#1a1205}
.chips,.strip{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar,.strip::-webkit-scrollbar{display:none}
.chips{margin:12px 0 4px}
.chips button{flex:none;height:40px;padding:0 16px;border-radius:20px;background:#14141a;font-weight:600;font-size:14px;color:#cfd3da}
h2{margin:0 16px 8px;font-size:16px}
section{margin:18px 0;scroll-margin-top:64px}
.strip{scroll-snap-type:x proximity;gap:10px}
.p{position:relative;flex:none;width:var(--pw);aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#14141a;scroll-snap-align:start;outline:2px solid transparent;outline-offset:2px;transition:outline-color .2s,transform .2s}
.p.sel{outline-color:var(--ac);transform:translateY(-3px)}
.p img{width:100%;height:100%;object-fit:cover;display:block}
.pg{position:absolute;left:0;bottom:0;height:4px;background:var(--ac)}
.sk{flex:none;width:var(--pw);aspect-ratio:2/3;border-radius:10px;background:#101014}
.m{color:var(--mut);padding:10px 0}
#rows .m{padding:12px 16px}
#sh{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:none;align-items:flex-end}
#sh.on{display:flex}
#shc{width:100%;max-height:88vh;overflow:auto;background:#101014;border-radius:20px 20px 0 0;padding:12px 16px calc(env(safe-area-inset-bottom) + 20px)}
#sh.full{align-items:stretch}
#sh.full #shc{max-height:none;border-radius:0;padding-top:calc(env(safe-area-inset-top) + 12px)}
.x{display:block;margin:0 0 -44px auto;width:44px;height:44px;border-radius:22px;background:#1c1c22;font-size:18px}
label{display:block;margin:0 0 12px;color:var(--mut);font-size:13px}
input,textarea,select{display:block;width:100%;margin-top:4px;padding:12px;border-radius:10px;border:1px solid #26262e;background:#0a0a0d;font-size:16px}
.src{display:flex;flex-direction:column;gap:6px;padding:12px;margin-bottom:8px;border-radius:12px;background:#17171d}
.si{display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer}
.si b{font-size:14px;word-break:break-word}
.si small,.mt{color:var(--mut);font-size:12px}
.sb{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bd{font-size:12px;font-weight:700;color:#1a1205;background:var(--ac);border-radius:5px;padding:2px 7px}
.bd.g{background:#4ade80}
.sb button{height:36px;padding:0 12px;border-radius:8px;background:#23232b;font-size:13px;font-weight:600}
.ep{display:flex;gap:8px;align-items:center;width:100%;min-height:52px;padding:8px 12px;margin-bottom:6px;border-radius:12px;background:#17171d;text-align:left}
.ep small{margin-left:auto;color:var(--mut)}
#pl{position:fixed;inset:0;z-index:60;background:#000;display:none}
#pl.on{display:block}
#pl video{width:100%;height:100%}
#pl .pc{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:8px;z-index:2;display:flex;gap:8px}#pl .x{margin:0}.x.w{width:auto;padding:0 16px;font-size:14px;font-weight:600}#sp{position:absolute;left:0;right:0;bottom:0;max-height:55%;overflow:auto;background:#101014;z-index:3;display:none;padding:12px 16px calc(env(safe-area-inset-bottom) + 16px)}#sp button{display:block;width:100%;min-height:48px;text-align:left;border-radius:10px;padding:0 12px}
#pe{position:absolute;left:16px;right:70px;top:calc(env(safe-area-inset-top) + 16px);color:#ffb4a8;font-size:13px}
#tt{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);z-index:70;background:#2a2a32;padding:10px 18px;border-radius:20px;display:none}
@media(orientation:landscape) and (max-height:520px){:root{--pw:clamp(84px,14vw,130px)}#hero{min-height:78vh}}
#pe{top:calc(env(safe-area-inset-top) + 64px);right:16px}
.sa{display:flex;gap:8px}.sa button{height:44px;padding:0 14px;border-radius:10px;background:#23232b;font-weight:600;font-size:14px}.sa .go{flex:2;background:var(--ac);color:#1a1205;font-weight:700}
#dt{position:fixed;inset:0;z-index:30;background:#000;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:none}#dt.on{display:block}
.dh{position:relative;height:clamp(240px,42vh,400px);background:#111 center top/cover}.dh:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#000 2%,rgba(0,0,0,.2) 60%,rgba(0,0,0,.35))}
.bk{position:absolute;z-index:1;left:8px;top:calc(env(safe-area-inset-top) + 8px);width:44px;height:44px;border-radius:22px;background:rgba(0,0,0,.55);font-size:28px;line-height:1}
.db{position:relative;margin-top:-56px;padding:0 16px calc(env(safe-area-inset-bottom) + 30px);display:flex;flex-direction:column;gap:12px}
.cast{margin:0;color:var(--mut);font-size:13px}
.dh{display:flex;align-items:flex-end;height:clamp(340px,56vh,500px)}
.di{position:relative;z-index:1;width:100%;padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
.db{margin-top:0;padding-top:8px}
.h{margin:12px 0 6px;font-size:16px}.ovf{margin:0;color:#e1e3e8;font-size:14px}
@media(orientation:landscape) and (max-height:520px){.dh{height:100vh;height:100dvh}.dh:after{background:linear-gradient(to right,rgba(0,0,0,.88),rgba(0,0,0,0) 70%),linear-gradient(to top,#000 2%,rgba(0,0,0,0) 40%)}.di{width:62%;padding:0 24px 24px calc(env(safe-area-inset-left) + 24px)}.db{padding:16px 24px 30px}.di .bt .b{flex:none;padding:0 22px}}
#hero{margin-top:0;min-height:0;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;padding:4px 16px 0;scrollbar-width:none;background:none;align-items:stretch}
#hero::-webkit-scrollbar{display:none}#hero:after{display:none}
.cc{flex:none;position:relative;width:min(86vw,640px);aspect-ratio:16/9;border-radius:16px;scroll-snap-align:center;background:#0a0a0d center/cover;overflow:hidden;text-align:left;display:flex;align-items:flex-end;border:1px solid #1c1c22}
.cc:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92),rgba(0,0,0,0) 65%)}
.ct{position:relative;z-index:1;padding:14px;display:flex;flex-direction:column;gap:2px}.ct b{font-size:20px;line-height:1.15}.ct small{color:#d5d8de;font-size:13px}
.sh{display:flex;justify-content:space-between;align-items:center}.sh button{color:var(--mut);font-size:13px;min-height:32px;padding:0 4px}
#shc{background:#000;border-top:1px solid #23232b}
.src,.ep{background:#000;border:1px solid #23232b}
.chips button{background:#000;border:1px solid #23232b}
input,textarea,select{background:#000;border-color:#2a2a33}
.x{background:#000;border:1px solid #2a2a33}
#sp{background:#000;border-top:1px solid #23232b}
.p,.sk{border:1px solid #16161b}
@media(orientation:landscape) and (max-height:520px){.cc{width:min(70vw,60vh*1.778)}}
.tab{height:36px;padding:0 14px;margin-right:8px;border:1px solid #4a4a52;border-radius:18px;font-weight:600;font-size:14px;color:#fff}
.tab.on{background:#fff;color:#000;border-color:#fff}
.chips button{border-color:#3a3a42;color:#fff;font-weight:500}
h2{font-size:18px}
.b{height:46px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;background:#2b2b30;color:#fff}
.b.p1{background:#fff;color:#000}
.sa .go{background:#fff;color:#000}
.ct b{font-size:22px;font-weight:800;letter-spacing:-.01em}
.cb{display:flex;gap:8px;margin-top:10px}.cb .b{flex:none;height:40px;padding:0 16px;font-size:14px}
.cc{border-radius:14px}
#sb2 button{margin-left:10px;height:32px;padding:0 12px;border:1px solid #3a3a42;border-radius:8px;color:#fff;font-size:13px}
.pk{display:block;width:100%;min-height:44px;text-align:left;padding:0 12px;border:1px solid #23232b;border-radius:10px;margin-bottom:6px}
#sc{margin-bottom:6px}
.cap{margin:14px 16px 0;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
#chips,#gen{margin:8px 0 2px}
h1,.ct b{font-weight:800}
.meta,.ct small{letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:#9fb0bf}
.b{border:0;border-radius:999px;background:linear-gradient(180deg,#323235,#242427);color:#fff;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 3px #070708,0 0 0 4px #19191b,0 8px 18px rgba(0,0,0,.55)}
.b.p1{background:linear-gradient(180deg,#323235,#242427);color:#fff}
.b svg{flex:none}.b.p1 svg{color:var(--ac)}
.bt{gap:14px}.cb{gap:12px}
.sa button{border-radius:999px;background:linear-gradient(180deg,#323235,#242427);box-shadow:inset 0 1px 0 rgba(255,255,255,.09)}
.sa .go{background:linear-gradient(180deg,#323235,#242427);color:var(--ac)}
.pill{border-radius:999px;padding:2px 9px}
</style>
</head>
<body>
<div id="top"><b>TorBox</b><button class="tab on" data-t="movie">Film</button><button class="tab" data-t="series">Dizi</button><span style="flex:1"></span>
<button class="ib" id="bs" aria-label="Ara"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
<button class="ib" id="bg" aria-label="Ayarlar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button></div>
<header id="hero" aria-label="Öne çıkanlar"></header>
<div class="cap">Listeler</div><nav class="chips" id="chips" aria-label="Listeler"></nav><div class="cap">Kategoriler</div><nav class="chips" id="gen" aria-label="Kategoriler"></nav>
<main id="rows"></main>
<div id="dt"></div>
<div id="sh"><div id="shc"></div></div>
<div id="pl"><div class="pc"><button class="x" onclick="history.back()" aria-label="Kapat">✕</button><button class="x w" id="sb">Altyazı</button><button class="x w" id="fs">Tam ekran</button></div><div id="pe"></div><div id="sp"></div><video id="v" controls playsinline></video></div>
<div id="tt"></div>
<script>
const $=s=>document.querySelector(s),L=localStorage;
const J=(k,d)=>{try{return JSON.parse(L.getItem(k))||d}catch(e){return d}};
const W=(k,v)=>{try{L.setItem(k,JSON.stringify(v))}catch(e){}};
let cfg=Object.assign({tmdb:'',omdb:'',cat:'',src:'',sub:'',vsub:'1',player:'vlc'},J('cfg',{})),hist=J('hist',[]),fav=J('fav',[]),tab='movie',rows=[],cur=null;
const reg={},ic={},RL=['','SD','720p','1080p','4K'];
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const B=u=>u.trim().replace(/^stremio:\/\//,'https://').replace(/\/manifest\.json.*$/,'').replace(/\/+$/,'');
const K=x=>x.type+'|'+x.id;
async function G(u,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||15000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}catch(e){throw new Error(e.name=='AbortError'?'zaman aşımı':/fetch|Load failed/i.test(e.message)?'bağlanılamadı':e.message)}finally{clearTimeout(t)}}
const SV=p=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${p}</svg>`,IP=SV('<path d="M7 4l13 8-13 8z"/>'),IA=SV('<path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/>'),IK=SV('<path d="M9 16.2l-3.5-3.5L4 14.2l5 5 11-11-1.5-1.5z"/>'),ID=SV('<path d="M5 8l7 8 7-8z"/>');
function togF(x){const k=K(x),i=fav.findIndex(h=>K(h)==k);if(i<0)fav.unshift(x);else fav.splice(i,1);W('fav',fav);draw();return i<0}
function toast(t){const e=$('#tt');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
const on=s=>$(s).classList.contains('on');
let dstack=[];
function sheet(h,full){if(!on('#sh'))history.pushState({},'');$('#shc').innerHTML='<button class="x" onclick="history.back()" aria-label="Kapat">✕</button>'+h;$('#sh').classList.add('on');$('#sh').classList.toggle('full',!!full);$('#shc').onclick=null;$('#shc').scrollTop=0}
function hideS(){$('#sh').classList.remove('on')}
function closeS(){if(on('#sh'))history.back()}
$('#sh').onclick=e=>{if(e.target.id=='sh')closeS()};
addEventListener('popstate',()=>{if(on('#pl'))stopW();else if(on('#sh'))hideS();else if(on('#dt')){dstack.pop();if(dstack.length)renderD(dstack[dstack.length-1]);else{$('#dt').classList.remove('on');$('#dt').innerHTML=''}}});

function strip(a){return a.map(x=>{reg[K(x)]=x;return`<button class="p${cur&&K(cur)==K(x)?' sel':''}" data-k="${E(K(x))}" aria-label="${E(x.name)}"><img loading="lazy" src="${E(x.poster)}" alt="${E(x.name)}">${x.d?`<i class="pg" style="width:${Math.min(100,x.t/x.d*100)}%"></i>`:''}</button>`}).join('')}
const GN=[['Aksiyon','Action'],['Macera','Adventure'],['Animasyon','Animation'],['Komedi','Comedy'],['Suç','Crime'],['Belgesel','Documentary'],['Dram','Drama'],['Aile','Family'],['Fantastik','Fantasy'],['Korku','Horror'],['Gizem','Mystery'],['Romantik','Romance'],['Bilim Kurgu','Sci-Fi'],['Gerilim','Thriller'],['Savaş','War']];
function genre(i){const g=GN[i],ty=tab;let sk=0;
sheet('<h3>'+E(g[0])+'</h3><div class="strip" id="gl" style="flex-wrap:wrap;overflow:visible;padding:0"></div><p class="m" id="gm">Yükleniyor…</p><button class="b" id="gx" style="display:none;width:100%;margin-top:14px">Daha fazla</button>',1);
const more=async()=>{try{const d=await G('https://v3-cinemeta.strem.io/catalog/'+ty+'/top/genre='+encodeURIComponent(g[1])+(sk?'&skip='+sk:'')+'.json'),a=d.metas||[];sk+=a.length;const m=a.filter(x=>x.poster);$('#gl').insertAdjacentHTML('beforeend',strip(m));$('#gm').textContent=sk?'':'Sonuç yok.';$('#gx').style.display=a.length?'flex':'none'}catch(e){$('#gm').textContent='Yüklenemedi: '+e.message}};
$('#gx').onclick=more;$('#shc').onclick=e=>{const p=e.target.closest('.p');if(p)openD(p.dataset.k)};more()}
function draw(){const v=rows.map((r,i)=>[r,i]).filter(a=>a[0].c.type==tab),sec=(t,a)=>a.length?`<section><h2>${t}</h2><div class="strip">${strip(a)}</div></section>`:'';
$('#chips').innerHTML=v.map(a=>`<button data-g="${a[1]}">${E(a[0].c.name)}</button>`).join('');
$('#gen').innerHTML=GN.map((g,i)=>`<button data-gn="${i}">${g[0]}</button>`).join('');
$('#rows').innerHTML=sec('Devam et',hist.filter(x=>x.type==tab))+sec('Listem',fav.filter(x=>x.type==tab))+v.map(a=>`<section id="r${a[1]}"><h2 class="sh">${E(a[0].c.name)}<button data-all="${a[1]}">Tümü ›</button></h2><div class="strip" id="s${a[1]}">${a[0].items?strip(a[0].items):'<i class="sk"></i>'.repeat(5)}</div></section>`).join('')||'<p class="m">Liste yok.</p>'}
async function load(){if(!cfg.cat){settings();return}
$('#rows').innerHTML='<p class="m">Listeler yükleniyor…</p>';
carT='';try{const b=B(cfg.cat),m=await G(b+'/manifest.json');
rows=(m.catalogs||[]).filter(c=>['movie','series'].includes(c.type)&&!(c.extra||[]).some(e=>e.isRequired)&&!(c.extraRequired||[]).length).slice(0,20).map(c=>({c,items:null}));
draw();first();
rows.forEach(async(r,i)=>{try{const d=await G(b+'/catalog/'+r.c.type+'/'+encodeURIComponent(r.c.id)+'.json');r.items=(d.metas||[]).filter(x=>x.poster)}catch(e){r.items=[]}
const s=$('#s'+i);if(s)s.innerHTML=r.items.length?strip(r.items):'<p class="m">Boş</p>';first()})}
catch(e){$('#rows').innerHTML='<p class="m">Listeler alınamadı: '+E(e.message)+'. Ayarlar’dan bağlantıyı kontrol et.</p>'}}
let carT='';
function first(){if(carT==tab)return;const r=rows.find(r=>r.c.type==tab&&r.items&&r.items.length);if(!r){$('#hero').innerHTML='';return}carT=tab;const a=r.items.slice(0,6);a.forEach(x=>reg[K(x)]=x);
$('#hero').innerHTML=a.map(x=>{const k=E(K(x)),isF=fav.some(h=>K(h)==K(x));return`<div class="cc" data-k="${k}" style="background-image:url('${E(x.background||x.poster)}')"><span class="ct"><b>${E(x.name)}</b><small>${E((x.type=='movie'?'Film':'Dizi')+(x.releaseInfo||x.year?' · '+(x.releaseInfo||x.year):''))}${x.imdbRating?' · IMDb '+String(x.imdbRating).replace('.',','):''}</small><span class="cb"><button class="b p1" data-cp="${k}">${IP} Oynat</button><button class="b" data-cf="${k}">${isF?IK+' Listemde':IA+' Listem'}</button></span></span></div>`}).join('');
a.forEach(x=>info(x).then(d=>{if(d&&d.bd){const e=document.querySelector('.cc[data-k="'+CSS.escape(K(x))+'"]');if(e)e.style.backgroundImage="url('https://image.tmdb.org/t/p/w780"+d.bd+"')"}}))}
function allv(i){const r=rows[i];sheet('<h3>'+E(r.c.name)+'</h3><div class="strip" style="flex-wrap:wrap;overflow:visible;padding:0">'+strip(r.items||[])+'</div>',1);$('#shc').onclick=e=>{const p=e.target.closest('.p');if(p)openD(p.dataset.k)}}
const rate=(x,d)=>{const v=d&&d.imdb||x.imdbRating;if(v)return['IMDb',v];if(d&&d.r)return['TMDB',d.r.toFixed(1)]}
async function info(x){const k=K(x);if(k in ic)return ic[k];let d=null;
if(cfg.tmdb&&/^tt/.test(x.id)){try{const f=await G('https://api.themoviedb.org/3/find/'+x.id.split(':')[0]+'?external_source=imdb_id&language=tr-TR&api_key='+cfg.tmdb),m=f.movie_results[0]||f.tv_results[0];
